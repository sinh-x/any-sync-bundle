# Production deployment with Traefik, external MongoDB/Redis, and Wasabi S3
#
# Usage:
#   1. Copy .env.example to .env and configure your settings
#   2. Run: ./scripts/setup.sh
#   Or manually:
#   1. mkdir -p traefik && touch traefik/acme.json && chmod 600 traefik/acme.json
#   2. docker compose up -d
#   3. Wait for MongoDB to become healthy, then verify replica set initialization
#
# Ports exposed:
#   - 80/443: HTTP/HTTPS (Traefik - Let's Encrypt + optional web proxy)
#   - 33010/tcp: Any-sync DRPC protocol
#   - 33020/udp: Any-sync QUIC protocol

services:
  traefik:
    image: docker.io/traefik:v3.5.3
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"           # HTTP (Let's Encrypt ACME challenge)
      - "443:443"         # HTTPS (optional web proxy)
      - "33010:33010"     # TCP for any-sync DRPC protocol
      - "33020:33020/udp" # UDP for any-sync QUIC protocol
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/acme.json:/acme.json
    networks:
      - anysync
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3

  mongo:
    image: docker.io/mongo:8.0.4
    container_name: mongo
    restart: unless-stopped
    command:
      - "--replSet"
      - "rs0"
      - "--port"
      - "27017"
    volumes:
      - ./data/mongodb:/data/db
    networks:
      - anysync
    healthcheck:
      test:
        - CMD-SHELL
        - |
          test $$(mongosh --quiet --host localhost:27017 --eval "try { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongo:27017'}]}).ok } catch (e) { rs.status().ok }") -eq 1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: docker.io/redis/redis-stack-server:7.4.0-v7
    container_name: redis
    restart: unless-stopped
    command:
      - "redis-server"
      - "--port"
      - "6379"
      - "--dir"
      - "/data/"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "noeviction"
      - "--protected-mode"
      - "no"
      - "--loadmodule"
      - "/opt/redis-stack/lib/redisbloom.so"
    volumes:
      - ./data/redis:/data
    networks:
      - anysync
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "localhost", "-p", "6379", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  any-sync-bundle:
    image: ghcr.io/grishy/any-sync-bundle:1.2.1-2025-12-10-minimal
    container_name: any-sync-bundle
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/bundle:/data
    networks:
      - anysync
    environment:
      # External address - clients will connect to this
      ANY_SYNC_BUNDLE_INIT_EXTERNAL_ADDRS: "${DOMAIN}:33010"
      # MongoDB connection
      ANY_SYNC_BUNDLE_INIT_MONGO_URI: "mongodb://mongo:27017/?replicaSet=rs0"
      # Redis connection
      ANY_SYNC_BUNDLE_INIT_REDIS_URI: "redis://redis:6379/"
      # Wasabi S3 Storage
      ANY_SYNC_BUNDLE_INIT_S3_BUCKET: "${S3_BUCKET}"
      ANY_SYNC_BUNDLE_INIT_S3_ENDPOINT: "${S3_ENDPOINT}"
      ANY_SYNC_BUNDLE_INIT_S3_REGION: "${S3_REGION}"
      # S3 Credentials (via standard AWS env vars)
      AWS_ACCESS_KEY_ID: "${S3_ACCESS_KEY}"
      AWS_SECRET_ACCESS_KEY: "${S3_SECRET_KEY}"
    labels:
      # Enable Traefik for this service
      - "traefik.enable=true"
      # TCP Router - routes any-sync TCP traffic
      - "traefik.tcp.routers.any-sync-tcp.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.any-sync-tcp.entrypoints=any-sync-tcp"
      - "traefik.tcp.routers.any-sync-tcp.service=any-sync-tcp-service"
      - "traefik.tcp.routers.any-sync-tcp.tls.passthrough=true"
      - "traefik.tcp.services.any-sync-tcp-service.loadbalancer.server.port=33010"
      # UDP Router - routes any-sync QUIC traffic
      - "traefik.udp.routers.any-sync-udp.entrypoints=any-sync-udp"
      - "traefik.udp.routers.any-sync-udp.service=any-sync-udp-service"
      - "traefik.udp.services.any-sync-udp-service.loadbalancer.server.port=33020"

networks:
  anysync:
    driver: bridge
