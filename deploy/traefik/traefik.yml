# Traefik Static Configuration for Any-Sync Production
#
# This configuration:
# - Handles Let's Encrypt SSL via HTTP challenge
# - Routes TCP/UDP traffic to any-sync-bundle
# - Provides HTTP to HTTPS redirect
# - Supports future web services via Docker labels

api:
  dashboard: false  # Disabled for security in production

log:
  level: INFO

# Entry points define where Traefik listens
entryPoints:
  # HTTP - used for Let's Encrypt ACME challenge and redirect to HTTPS
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  # HTTPS - for web services (future use)
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt

  # Any-sync TCP port (DRPC protocol)
  any-sync-tcp:
    address: ":33010"

  # Any-sync UDP port (QUIC protocol)
  any-sync-udp:
    address: ":33020/udp"

# Docker provider - discovers services via labels
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: anysync

# Let's Encrypt certificate resolver
certificatesResolvers:
  letsencrypt:
    acme:
      email: "${ACME_EMAIL}"
      storage: /acme.json
      httpChallenge:
        entryPoint: web
